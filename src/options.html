<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Communication Helper Settings</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        width: 340px;
        padding: 16px;
      }
      label {
        display: block;
        margin-top: 12px;
        font-size: 13px;
        font-weight: 600;
      }
      input[type="text"] {
        width: 100%;
        padding: 6px 8px;
        margin-top: 4px;
        box-sizing: border-box;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 14px;
      }
      button {
        padding: 6px 12px;
        cursor: pointer;
      }
      #status {
        margin-top: 10px;
        font-size: 12px;
        min-height: 16px;
      }
      .app-icon {
        width: 16px;
        height: 16px;
      }
      p.hint {
        font-size: 11px;
        color: #666;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <h3>WhatsApp, Teams &amp; Telegram → Telegram Alert</h3>

    <label for="botToken">Telegram Bot Token</label>
    <input type="text" id="botToken" placeholder="123456789:ABC..." />
    <p class="hint">Create a bot with @BotFather on Telegram to get this.</p>

    <label for="chatId">Telegram Chat ID</label>
    <input type="text" id="chatId" placeholder="e.g. 123456789" />
    <p class="hint">
      Message your bot once, then open
      https://api.telegram.org/bot&lt;TOKEN&gt;/getUpdates to find your chat id.
    </p>

    <div class="row">
      <input type="checkbox" id="enabled" checked />
      <label for="enabled" style="margin:0;">Enabled</label>
    </div>

    <div class="row">
      <input type="checkbox" id="whatsappEnabled" checked />
      <img class="app-icon" src="../icons/whatsapp.png" alt="" />
      <label for="whatsappEnabled" style="margin:0;">WhatsApp Web alerts</label>
    </div>

    <div class="row">
      <input type="checkbox" id="teamsEnabled" checked />
      <img class="app-icon" src="../icons/teams.png" alt="" />
      <label for="teamsEnabled" style="margin:0;">Microsoft Teams alerts</label>
    </div>

    <div class="row">
      <input type="checkbox" id="telegramEnabled" checked />
      <img class="app-icon" src="../icons/telegram.png" alt="" />
      <label for="telegramEnabled" style="margin:0;">Telegram Web alerts</label>
    </div>

    <div class="row">
      <button id="save">Save</button>
      <button id="test">Send test message</button>
    </div>

    <div id="status"></div>

    <script src="options.js"></script>
  </body>
</html>
